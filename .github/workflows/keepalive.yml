name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Health Endpoint
        run: curl -s https://regintel-backend-prod.onrender.com/health/ > /dev/null
      - name: Ping Staging Health Endpoint
        run: curl -s https://regintel-backend-staging.onrender.com/health/ > /dev/null
